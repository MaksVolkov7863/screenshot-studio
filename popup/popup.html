<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>СкринСтудия</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon.svg" alt="">
    <div>
      <strong>СкринСтудия</strong>
      <span>Снимок, GIF и редактор</span>
    </div>
  </header>
  <div class="grid">
    <button data-mode="region"><span class="ico">▭</span><span><b data-i="captureRegion">Область</b><small>Несколько кусков, копировать, пин</small></span><kbd>Alt+Shift+S</kbd></button>
    <button data-mode="visible"><span class="ico">▣</span><span><b data-i="captureVisible">Видимая область</b><small>То, что на экране</small></span><kbd>Alt+Shift+V</kbd></button>
    <button data-mode="full"><span class="ico">↕</span><span><b data-i="captureFull">Вся страница</b><small>Длинный скролл</small></span><kbd>Alt+Shift+F</kbd></button>
    <button data-mode="element"><span class="ico">◉</span><span><b data-i="captureElement">Элемент</b><small>Shift — скролл внутри</small></span><kbd>Alt+Shift+E</kbd></button>
    <button data-mode="scroll"><span class="ico">☰</span><span><b>Скролл колонки</b><small>Чат, сайдбар, лента</small></span></button>
    <button data-mode="timer"><span class="ico">⏱</span><span><b>Таймер</b><small>3 / 5 / 10 сек, пауза</small></span></button>
    <button data-mode="wait"><span class="ico">◎</span><span><b>Ждать изменение</b><small>Модалка, анимация</small></span></button>
    <button data-mode="hideui"><span class="ico">⊘</span><span><b>Без UI сайта</b><small>Cookie, sticky, чат</small></span></button>
    <button data-mode="gif"><span class="ico">🎞</span><span><b>GIF области</b><small>5–15 секунд</small></span></button>
    <button data-mode="scroll-video"><span class="ico">▶</span><span><b>Видео скролла</b><small>Прокрутка страницы</small></span></button>
    <button data-mode="video-frame"><span class="ico">🎬</span><span><b>Кадр из видео</b><small>Текущий кадр &lt;video&gt;</small></span></button>
    <button data-mode="repeat"><span class="ico">↺</span><span><b>Повторить последний</b><small>Тот же режим</small></span><kbd>Alt+Shift+R</kbd></button>
  </div>
  <footer>
    <button id="openEditor" class="link">Редактор</button>
    <button id="history" class="link">История</button>
    <button id="options" class="link">Настройки</button>
  </footer>
  <script src="../shared/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
