<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Выберите область — СкринСтудия</title>
  <link rel="stylesheet" href="picker.css">
</head>
<body>
  <div id="hint">Перетащите область · Shift — квадрат · Enter — весь кадр · Esc — отмена</div>
  <canvas id="hud"></canvas>
  <div id="bar" hidden>
    <button data-act="edit" class="primary">Править</button>
    <button data-act="copy">Копировать</button>
    <button data-act="save">Сохранить</button>
    <button data-act="add">Ещё область</button>
    <button data-act="cancel">Отмена</button>
  </div>
  <script src="picker.js"></script>
</body>
</html>
